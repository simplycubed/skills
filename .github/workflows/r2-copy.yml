# Copy every snapshot object from one R2 bucket to another. R2 has no rename, so
# moving to the <repo>-<thing>-<env> convention is a migration and this is its
# copy step (issue #51).
#
# Dispatch-only and non-destructive: it never deletes from either bucket, so the
# old bucket stays intact and serving until a human removes it deliberately.
name: Copy R2 objects between buckets

on:
  workflow_dispatch:
    inputs:
      source_bucket:
        description: "Bucket to copy FROM (e.g. simplycubed-skills)"
        required: true
      dest_bucket:
        description: "Bucket to copy TO (e.g. skills-cdn-prod)"
        required: true
      dry_run:
        description: "Derive the key set from git and copy nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      WRANGLER_VERSION: "4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_SOURCE_BUCKET: ${{ inputs.source_bucket }}
      R2_BUCKET: ${{ inputs.dest_bucket }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Preflight — confirm the token/account resolve
        run: wrangler whoami

      - name: Create the destination bucket (idempotent)
        if: ${{ !inputs.dry_run }}
        run: node scripts/r2-bootstrap.mjs

      - name: Copy (re-hashes every blob against the git manifest before writing)
        run: node scripts/r2-copy.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
